name: Deployment
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: rm -rf k8s/secret.yaml
      - run: |
          mkdir -p ~/.kube
          echo "${{secrets.KUBECONFIG}}" > ~/.kube/config
      - run: kubectl get nodes
      - run: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/latest/download/standard-install.yaml
      - run: kubectl apply -f k8s/
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
