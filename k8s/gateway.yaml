apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      hostname: "dashboard.mlclogistica.app"
      allowedRoutes:
        namespaces:
          from: Same
    - name: api
      protocol: HTTP
      port: 8000
      hostname: "dashboard-api.mlclogistica.app"
      allowedRoutes:
        namespaces:
          from: Same
