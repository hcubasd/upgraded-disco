apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-api
  labels:
    app.kubernetes.io/name: oauth2-proxy-api
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy-api
  ports:
    - port: 4180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-api
  labels:
    app.kubernetes.io/name: oauth2-proxy-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy-api
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
          args:
            - --provider=entra-id
            - --oidc-issuer-url=https://login.microsoftonline.com/common/v2.0
            - --insecure-oidc-skip-issuer-verification=true
            - "--scope=openid profile email User.Read"
            - --upstream=http://api
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://api.dashboard.mlclogistica.app/oauth2/callback
            - --email-domain=mlclogistica.com.br
            - --skip-provider-button=true
            - --cookie-domain=.mlclogistica.app
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: OAUTH2_PROXY_COOKIE_SECRET
