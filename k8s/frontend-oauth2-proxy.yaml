apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-frontend
  labels:
    app.kubernetes.io/name: oauth2-proxy-frontend
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy-frontend
  ports:
    - port: 4180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-frontend
  labels:
    app.kubernetes.io/name: oauth2-proxy-frontend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy-frontend
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:latest
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://login.microsoftonline.com/$(OAUTH2_PROXY_OIDC_TENANT_ID)/v2.0
            - --upstream=http://frontend
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://dashboard.mlclogistica.app/oauth2/callback
            - --email-domain=mlclogistica.com.br
          env:
            - name: OAUTH2_PROXY_OIDC_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: OAUTH2_PROXY_OIDC_TENANT_ID
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: OAUTH2_PROXY_COOKIE_SECRET
